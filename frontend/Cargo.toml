[package]
name = "markdown_ultimate_frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
  "Element", "Storage", "Blob", "Url", "BlobPropertyBag", "console", "File",
  "FileList", "FileReader", "ProgressEvent", "DragEvent", "DataTransfer", "MouseEvent",
  "Request", "RequestInit", "RequestMode", "Response", "DomRect", "HtmlInputElement",
  "Headers"
] }
gloo-storage = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
mu_markdown_core = { path = "../modules/markdown_core" }
mu_workflow = { path = "../modules/workflow" }
mu_workspace = { path = "../modules/workspace" }
mu_diagnostics = { path = "../code/diagnostics" }
uuid = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
