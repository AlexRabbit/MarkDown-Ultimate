[package]
name = "markdown_ultimate_engine"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "markdown_ultimate_engine"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-files = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
async-nats = "0.38"
mu_config = { path = "../code/config" }
mu_diagnostics = { path = "../code/diagnostics" }
mu_workspace = { path = "../modules/workspace" }
mu_persistence = { path = "../databases" }
