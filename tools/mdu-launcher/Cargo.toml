[workspace]

[package]
name = "mdu-launcher"
version = "0.2.3"
edition = "2021"
authors = ["AlexRabbit"]
license = "MIT"
description = "Portable Windows app — local server + native webview (no browser, no console)"

[[bin]]
name = "MarkDownUltimate"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.46"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
