[package]
name = "mu_markdown_core"
description = "CommonMark + GFM + Telegram-rich markdown rendering"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
comrak = { version = "0.58", default-features = false, features = ["shortcodes"] }
regex = "1"
ammonia = "4"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
